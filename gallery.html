    /* Override gallery grid for gallery page — use CSS grid instead of multi-column */
    .gallery-photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

    }
    .gallery-photo-grid .gallery-item {

    .gallery-video-grid {

    @media (max-width: 768px) {
      .gallery-photo-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-video-grid { grid-template-columns: repeat(2, 1fr); }
    }

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script>
    const langData = {
      "sr": { "pageLabel": "Naš rad", "pageTitle": "Galerija", "pageSub": "Momenti koje smo stvorili zajedno", "photoTitle": "Fotografije", "videoTitle": "Video", "ctaBtn": "Zatražite ponudu", "footerRights": "Sva prava zadržana.", "navHome": "Početna", "navAbout": "O nama", "navSound": "Zvuk", "navLight": "Svetlo", "navEffects": "Efekti", "navGallery": "Galerija", "navContact": "Kontakt" },
      "ru": { "pageLabel": "Наша работа", "pageTitle": "Галерея", "pageSub": "Моменты, которые мы создали вместе", "photoTitle": "Фотографии", "videoTitle": "Видео", "ctaBtn": "Запросить предложение", "footerRights": "Все права защищены.", "navHome": "Главная", "navAbout": "О компании", "navSound": "Звук", "navLight": "Свет", "navEffects": "Эффекты", "navGallery": "Галерея", "navContact": "Контакты" },
      "en": { "pageLabel": "Our Work", "pageTitle": "Gallery", "pageSub": "Moments we created together", "photoTitle": "Photos", "videoTitle": "Videos", "ctaBtn": "Get a Quote", "footerRights": "All rights reserved.", "navHome": "Home", "navAbout": "About Us", "navSound": "Sound", "navLight": "Light", "navEffects": "Effects", "navGallery": "Gallery", "navContact": "Contact" }
    };
    function changeLanguage(lang) {
      document.documentElement.lang = lang === 'sr' ? 'sr-Latn' : lang;
      const data = langData[lang];
      document.querySelectorAll('[data-lang-key]').forEach(el => { const k = el.getAttribute('data-lang-key'); if (data[k]) el.innerHTML = data[k]; });
      ['sr','ru','en'].forEach(l => {
        const b1 = document.getElementById(`langBtn-${l}`), b2 = document.getElementById(`mLangBtn-${l}`);
        if (b1) b1.classList.toggle('active', l === lang);
        if (b2) b2.classList.toggle('active', l === lang);
      });
      document.title = lang === 'ru' ? 'VinylM — Галерея' : lang === 'en' ? 'VinylM — Gallery' : 'VinylM — Galerija';
    }
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobileNav');
    hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); mobileNav.classList.toggle('open'); });
    window.addEventListener('scroll', () => {
      const s = document.documentElement.scrollTop, h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      document.getElementById('scrollProgress').style.width = (s/h*100) + '%';
      document.getElementById('siteHeader').classList.toggle('scrolled', s > 50);
    }, { passive: true });
    const obs = new IntersectionObserver((es) => { es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }); }, { threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    document.addEventListener('DOMContentLoaded', () => {
      changeLanguage('sr');
      Fancybox.bind('[data-fancybox="gallery-photo"]', { Thumbs: { type: 'strip' } });
      document.querySelectorAll('.video-item').forEach(item => {
        item.addEventListener('click', function() {
          if (this.querySelector('video')) return;
          const src = this.dataset.videoSrc;
          if (!src) return;
          const v = document.createElement('video');
          v.src = src; v.autoplay = true; v.muted = true; v.controls = true; v.loop = true; v.playsinline = true;
          this.innerHTML = '';
          this.appendChild(v);
          this.classList.add('video-playing');
        });
      });
    });
  </script>
