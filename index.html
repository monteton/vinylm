<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylM — Dobrodošli</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-dark: #000000;
      --color-light: #fff;
      --color-gray: #ccc;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center; /* Центрирует по вертикали */
      justify-content: center; /* Центрирует по горизонтали */
      background-color: var(--color-dark);
      font-family: 'Montserrat', sans-serif;
      position: relative; /* Необходимо для позиционирования дочерних элементов */
    }
    .splash-container {
      text-align: center;
    }
    .splash-logo {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    }
    .phone-number {
        color: var(--color-gray);
        font-size: 1.2em;
        font-weight: 400;
        margin-top: 25px; /* Отступ от логотипа */
        letter-spacing: 1.5px;
    }

    /* --- ИЗМЕНЕНИЯ ЗДЕСЬ --- */
    /* Контейнер для позиционирования кнопки внизу */
    .button-container {
        position: absolute;
        bottom: 50px; /* Отступ от нижнего края экрана */
        left: 0;
        right: 0;
        text-align: center;
    }

    /* Стили для переливающейся кнопки */
    .start-button {
      display: inline-block;
      padding: 15px 45px;
      font-size: 1.5em;
      font-weight: 700;
      color: #333;
      text-decoration: none;
      border-radius: 50px;
      border: 2px solid #ccc;
      background: linear-gradient(
        100deg,
        #a9a9a9, #f0f0f0, #a9a9a9, #d3d3d3, #a9a9a9
      );
      background-size: 300% 100%;
      transition: all 0.4s ease-in-out;
      animation: shimmer 4s infinite linear;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }
    .start-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 214, 0, 0.3);
      color: #000;
    }

    /* Анимация переливания */
    @keyframes shimmer {
      0% { background-position: 150% 0; }
      100% { background-position: -150% 0; }
    }

    /* Адаптивность для мобильных */
    @media (max-width: 480px) {
        .splash-logo {
            width: 180px;
            height: 180px;
        }
        .phone-number {
            font-size: 1em;
        }
        .button-container {
            bottom: 40px; /* Уменьшаем отступ на мобильных */
        }
        .start-button {
            font-size: 1.2em;
            padding: 12px 35px;
        }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <img src="videos/logo.gif" alt="VinylM Animated Logo" class="splash-logo">
    <p class="phone-number">+382 67 439 100</p>
  </div>
  
  <div class="button-container">
    <a href="main.html" class="start-button">START</a>
  </div>

</body>
</html>
