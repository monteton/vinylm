<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VinylM — Event Solutions | Montenegro · звук, свет, экраны для событий</title>
<meta name="description" content="VinylM — profesionalno ozvučenje, rasveta i LED ekrani za festivale, koncerte i korporativne događaje u Crnoj Gori. Звук, свет, спецэффекты, LED-экраны. Budva, Montenegro. Since 2007.">
<link rel="canonical" href="https://vinyl-m.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="VinylM — Event Solutions | Montenegro">
<meta property="og:description" content="Professional sound, light, LED screens and special effects for festivals, concerts and corporate events in Montenegro.">
<meta property="og:image" content="https://vinyl-m.com/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://vinyl-m.com/assets/img/og-image.jpg">
<meta property="og:url" content="https://vinyl-m.com/">
<link rel="stylesheet" href="assets/fonts/fonts-v3.css">
<style>
:root{--paper:#f2eee6;--paper2:#e9e4d9;--ink:#111;--red:#ff4a1c;--red2:#e63a0f;--mut:#6f695d;--line:rgba(17,17,17,.16);--disp:'Montserrat',system-ui,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;overflow-x:clip}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{font:500 17px/1.6 var(--sans);background:var(--paper);color:var(--ink);overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font:inherit;color:inherit}
::selection{background:var(--red);color:#fff}
.ic{width:1em;height:1em;display:block}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.rv{opacity:0;transform:translateY(48px)}
em.s{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:0;text-transform:none}
.text-gold{color:var(--red);font-family:var(--serif);font-style:italic;font-weight:600;text-transform:none;letter-spacing:0}

/* loader / progress */
.loader{position:fixed;inset:0;z-index:300;background:var(--red);display:grid;place-items:center;overflow:hidden}
.loader .rec{width:min(40vw,200px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);position:relative;animation:spin 1.6s linear infinite;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.loader .rec::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--paper)}
.loader .rec::before{content:"";position:absolute;left:49%;top:49%;width:2%;height:2%;border-radius:50%;background:#111;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:fixed;left:0;top:0;height:4px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(0);z-index:150}

/* header */
header.top{position:fixed;left:0;right:0;top:0;z-index:120;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px clamp(18px,4vw,56px);transition:background .4s,box-shadow .4s}
header.top.solid{background:rgba(242,238,230,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.logo img{height:46px;width:auto}
.nav{display:flex;gap:clamp(14px,2vw,30px);font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.nav a{position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--red);transform:scaleX(0);transform-origin:100% 50%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.nav a:hover::after{transform:scaleX(1);transform-origin:0 50%}
.hr{display:flex;align-items:center;gap:10px}
.langs{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden}
.langs button{border:0;background:none;padding:7px 13px;font:700 12px var(--sans);letter-spacing:.08em;cursor:pointer;transition:background .25s,color .25s}
.langs button.on{background:var(--ink);color:var(--paper)}
.menubtn{display:none;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:99px;border:0;background:var(--ink);color:var(--paper);font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.menubtn i{display:block;width:18px;height:2px;background:currentColor;position:relative}
.menubtn i::after{content:"";position:absolute;left:0;top:6px;width:18px;height:2px;background:currentColor;transition:.35s}
.menubtn.on i{background:transparent}.menubtn.on i::after{top:0;transform:rotate(45deg)}.menubtn.on i::before{top:0;transform:rotate(-45deg)}
.menubtn i::before{content:"";position:absolute;left:0;top:0;width:18px;height:2px;background:currentColor;transition:.35s}
@media(max-width:1020px){.nav,.hr>.langs{display:none}.menubtn{display:flex}}
.menu{position:fixed;inset:0;z-index:110;background:var(--red);padding:110px clamp(22px,6vw,60px) 30px;display:flex;flex-direction:column;overflow:auto;clip-path:inset(0 0 100% 0);visibility:hidden}
.menu.on{visibility:visible}
.menu a.big{display:flex;justify-content:space-between;align-items:baseline;font:900 clamp(34px,10vw,64px)/1.05 var(--disp);letter-spacing:-.04em;text-transform:uppercase;padding:8px 0;border-bottom:2px solid rgba(17,17,17,.9);overflow:hidden}
.menu a.big small{font:700 13px var(--sans);letter-spacing:.2em}
.menu .langs{margin-top:24px;align-self:flex-start;border-color:#111}
.menu .langs button.on{background:#111;color:var(--red)}

/* hero */
.hero{position:relative;min-height:100svh;padding:120px 0 40px;overflow:hidden;display:flex;flex-direction:column}
.hero-top{position:relative;flex:1;width:100%;display:flex;flex-direction:column;justify-content:center}
.vrec{position:absolute;right:-20vw;top:46%;width:min(58vw,800px);aspect-ratio:1;margin-top:calc(min(58vw,800px)/-2);border-radius:50%;will-change:transform;pointer-events:none}
.vrec .disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#101010 0 2px,#1c1c1c 2px 3px,#131313 3px 5px);box-shadow:0 50px 100px rgba(17,17,17,.35)}
.vrec .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.2) 30deg,rgba(255,255,255,0) 70deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.2) 210deg,rgba(255,255,255,0) 250deg)}
.vrec .lab{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a4d,var(--red) 60%,var(--red2));display:grid;place-items:center;box-shadow:0 0 0 6px #101010}
.vrec .lab img{width:46%;filter:brightness(0)}
.vrec .lab::after{content:"";position:absolute;left:50%;top:50%;width:7%;height:7%;margin:-3.5%;border-radius:50%;background:var(--paper)}
.hero h1{position:relative;z-index:3;font:900 clamp(70px,14.2vw,260px)/.84 var(--disp);letter-spacing:-.07em;text-transform:uppercase;margin-left:-.05em}
.hero h1 .ln{display:block;overflow:hidden;padding:.03em 0 .1em}
.hero h1 .ln>span{display:inline-block;will-change:transform}
.hero h1 .ln:nth-child(2)>span{color:var(--red)}
.hero-sub{position:relative;z-index:3;max-width:520px;font-size:clamp(17px,1.5vw,20px);margin-top:22px;font-weight:500}
.hero-badge{position:relative;z-index:3;font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;display:inline-flex;gap:14px;align-items:center;margin-bottom:20px}
.hero-badge::before{content:"";width:44px;height:2px;background:var(--red)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:18px 32px;border-radius:99px;font:700 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);cursor:pointer;position:relative;overflow:hidden;z-index:1}
.btn::before{content:"";position:absolute;inset:0;background:var(--red);transform:translateY(101%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:hover::before{transform:none}.btn:hover{color:#fff;border-color:var(--red)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{color:#fff}
.ctas{position:relative;z-index:3;display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hint{position:relative;z-index:3;font:700 11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin:44px 0 12px}
.cbts{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cbt{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:34px;padding:20px 22px;border-radius:26px;background:var(--card,#fff);border:2px solid var(--ink);text-align:left;cursor:pointer;min-height:156px;overflow:hidden;background:#fbf9f4}
.cbt::before{content:"";position:absolute;inset:0;background:var(--red);transform:translateY(101%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cbt:hover::before{transform:none}
.cbt>*{position:relative}
.cbt .n{font:700 12px var(--sans);letter-spacing:.2em;color:var(--mut)}
.cbt .nm{font:900 clamp(22px,2.4vw,34px)/1 var(--disp);letter-spacing:-.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cbt .nm .ic{width:30px;height:30px;flex:0 0 30px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cbt:hover .nm .ic{transform:rotate(-45deg)}
.cbt:hover{color:#fff}.cbt:hover .n{color:rgba(255,255,255,.8)}
@media(max-width:900px){.cbts{grid-template-columns:1fr 1fr;gap:10px}.cbt{min-height:128px;gap:20px;padding:16px;border-radius:22px}.vrec{right:-34vw;top:30%;width:92vw;margin-top:-46vw;opacity:.16}.hero{padding-top:100px}.hero h1{font-size:clamp(64px,22vw,200px)}.hero-top{justify-content:flex-start;padding-top:40px}}

/* promo banner */
.promo{position:relative;z-index:3;display:grid;grid-template-columns:auto 1fr auto;gap:clamp(14px,2.4vw,34px);align-items:center;margin-top:40px;padding:clamp(14px,2vw,22px) clamp(16px,2.4vw,30px);min-height:clamp(140px,15vw,210px);border-radius:28px;overflow:hidden;background:#111;color:#fff;border:2px solid var(--ink)}
.promo .pbg,.promo .pvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,14,.9) 6%,rgba(8,10,14,.5) 52%,rgba(8,10,14,.06) 100%);pointer-events:none;z-index:1}
.promo>*:not(.pbg):not(.pvid){position:relative;z-index:2}
.promo .pnew{font:900 13px var(--sans);letter-spacing:.16em;background:var(--red);color:#fff;padding:9px 16px;border-radius:99px;box-shadow:0 0 0 0 rgba(255,74,28,.7);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,74,28,0)}100%{box-shadow:0 0 0 0 rgba(255,74,28,0)}}
.promo .ptx b{display:block;font:900 clamp(24px,3vw,44px)/1.05 var(--disp);letter-spacing:-.05em;text-transform:uppercase}
.promo .ptx small{display:block;margin-top:6px;font:500 clamp(13px,1.2vw,16px)/1.4 var(--sans);color:#e8e3d8;max-width:560px}
.promo .pgo{display:flex;align-items:center;gap:12px;font:800 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.promo .pgo i{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.promo .pgo i .ic{width:20px;height:20px}
.promo:hover .pgo i{background:#fff;color:var(--ink)}
@media(max-width:900px){.promo{grid-template-columns:1fr auto;margin-top:26px;border-radius:24px;gap:10px 14px}.promo .pnew{grid-column:1/-1;justify-self:start}.promo .pgo span{display:none}.promo .ptx small{max-width:none}}
/* expanding photo */
.band{padding:0 clamp(18px,4vw,56px)}
.band .fr{width:min(720px,100%);aspect-ratio:1;margin:0 auto;border-radius:36px;overflow:hidden;position:relative;will-change:transform}
.band img{position:absolute;left:0;top:-10%;width:100%;height:120%;object-fit:cover}
.band .cap{position:absolute;left:24px;bottom:22px;font:700 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:10px 18px;border-radius:99px}

/* marquee */
.mq{padding:46px 0 10px;overflow:hidden;white-space:nowrap}
.mq div{display:inline-block;font:900 clamp(50px,9vw,140px)/1 var(--disp);letter-spacing:-.05em;text-transform:uppercase}
.mq span{margin:0 24px;color:transparent;-webkit-text-stroke:2px var(--ink)}
.mq i{font-style:normal;color:var(--red);font-size:.55em;vertical-align:middle}

/* sections */
.sec{padding:clamp(80px,11vw,170px) 0;position:relative}
.eyebrow{font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:22px}
.eyebrow::before{content:"";width:44px;height:2px;background:var(--red)}
h2{font:900 clamp(40px,7.4vw,118px)/.92 var(--disp);letter-spacing:-.06em;text-transform:uppercase}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em}.wd>span{display:inline-block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.st{padding:28px 18px 8px 0;border-right:1px solid var(--line)}
.st+.st{padding-left:22px}.st:last-child{border:0}
.st b{display:block;font:900 clamp(54px,8vw,130px)/.95 var(--disp);letter-spacing:-.07em}
.st b sup{color:var(--red);font-size:.5em;vertical-align:top}
.st span{font:700 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.st:nth-child(3){padding-left:0}.st:nth-child(2){border-right:0}.st:nth-child(-n+2){border-bottom:1px solid var(--line);padding-bottom:20px}}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(30px,6vw,110px);margin-top:50px}
.about .l{position:sticky;top:110px;align-self:start}
.about .l .ph{margin-top:28px;border-radius:30px;overflow:hidden;aspect-ratio:.82;position:relative;border:2px solid var(--ink)}
.about .l .ph img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover}
.sticker{position:absolute;right:-6px;top:-6px;width:120px;height:120px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font:900 34px/1 var(--disp);letter-spacing:-.05em;z-index:3;transform:rotate(12deg)}
.sticker small{display:block;font:700 9px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.about .r p{font-size:clamp(17px,1.5vw,21px);margin-bottom:22px;color:#2b2822}
.about .r p:first-child{font:600 clamp(28px,3.3vw,50px)/1.12 var(--serif);color:var(--ink)}
.pull{margin-top:40px;padding:34px 0 0;border-top:2px solid var(--ink);font:italic 600 clamp(26px,3vw,46px)/1.2 var(--serif)}
@media(max-width:900px){.about{grid-template-columns:1fr}.about .l{position:relative;top:0}}

/* catalog rows */
.cat{background:var(--ink);color:var(--paper)}
.cat h2 em,.cat .eyebrow{color:var(--red)}
.cat .eyebrow::before{background:var(--red)}
.cat-top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.cat-top p{max-width:400px;color:#b9b3a6}
.rows{margin-top:60px;border-top:1px solid rgba(255,255,255,.2)}
.row{border-bottom:1px solid rgba(255,255,255,.2)}
.row>button{width:100%;display:grid;grid-template-columns:90px 1fr auto 56px;gap:20px;align-items:center;padding:clamp(22px,3vw,40px) 0;background:none;border:0;cursor:pointer;text-align:left;color:var(--paper);transition:color .3s,padding .5s cubic-bezier(.2,.8,.2,1)}
.row>button:hover{color:var(--red);padding-left:20px}
.row .no{font:700 14px var(--sans);letter-spacing:.2em;color:#8c867a}
.row .nm{font:900 clamp(48px,10vw,170px)/.9 var(--disp);letter-spacing:-.07em;text-transform:uppercase}
.row .ct{font:600 14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8c867a}
.row .ar{width:56px;height:56px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;transition:transform .5s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.row .ar .ic{width:24px;height:24px}
.row.on .ar{transform:rotate(45deg);background:var(--red);border-color:var(--red);color:#fff}
.row .bd{height:0;overflow:hidden}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px clamp(20px,3vw,50px);padding:10px 0 50px 110px}
.g h4{display:flex;align-items:center;gap:12px;font:800 15px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:6px}
.g h4 .ic{width:24px;height:24px}
.g h4 em{margin-left:auto;font:600 12px var(--sans);font-style:normal;color:#8c867a}
.g li{list-style:none;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15.5px;color:#d9d3c6;transition:color .2s,padding .3s}
.g li:hover{color:#fff;padding-left:10px}
.g li.hot{color:#fff;font-weight:700;position:relative}
.g li.hot::after{content:"NEW";margin-left:10px;font:800 10px var(--sans);letter-spacing:.14em;background:var(--red);color:#fff;padding:3px 8px;border-radius:99px;vertical-align:middle}
@media(max-width:1000px){.row>button{grid-template-columns:1fr auto 48px;gap:12px}.row .no{display:none}.row .ar{width:48px;height:48px}.row .nm{font-size:clamp(44px,14vw,110px)}.row .ct{font-size:11px}.groups{grid-template-columns:1fr;padding:0 0 36px}}
@media(min-width:620px) and (max-width:1000px){.groups{grid-template-columns:1fr 1fr}}

/* portfolio */
.names{margin-top:44px;font:italic 600 clamp(34px,6.2vw,104px)/1.08 var(--serif);letter-spacing:-.01em}
.names span{display:inline;transition:color .25s}
.names span:hover{color:var(--red)}
.names i{font-style:normal;color:var(--red);font-family:var(--sans);font-weight:300;margin:0 .22em}
.evs{margin-top:60px;display:grid;grid-template-columns:repeat(2,1fr);gap:0 clamp(24px,5vw,80px)}
.evs .e{display:flex;gap:20px;align-items:baseline;padding:22px 0;border-top:1px solid var(--ink);font:700 clamp(17px,1.7vw,24px)/1.25 var(--sans)}
.evs .e b{font:700 12px var(--sans);letter-spacing:.2em;color:var(--red)}
@media(max-width:800px){.evs{grid-template-columns:1fr}}

/* gallery (pinned horizontal) */
.gal{background:var(--paper2);overflow:hidden}
.gal .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.pin{margin-top:50px;height:100svh;display:flex;align-items:center}
.gtrack{display:flex;gap:22px;padding:0 clamp(18px,6vw,90px);will-change:transform}
.gc{flex:0 0 auto;height:min(64vh,560px);border-radius:26px;overflow:hidden;position:relative;cursor:pointer;border:2px solid var(--ink)}
.gc img{height:100%;width:auto;display:block;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.gc:hover img{transform:scale(1.06)}
.gc .no{position:absolute;left:14px;top:12px;font:900 18px var(--disp);color:#fff;mix-blend-mode:difference}
.gc.endc{width:min(70vw,420px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:34px;background:var(--red);cursor:default;gap:20px}
.gc.endc h3{font:900 clamp(30px,3.4vw,48px)/1 var(--disp);letter-spacing:-.05em;text-transform:uppercase}
.gnote{position:absolute;left:clamp(18px,6vw,90px);bottom:5vh;display:flex;gap:14px;align-items:center;font:700 12px var(--sans);letter-spacing:.24em;text-transform:uppercase}
.gnote i{display:block;width:90px;height:3px;background:rgba(17,17,17,.2);position:relative}
.gnote i b{position:absolute;inset:0;background:var(--red);transform-origin:0 50%;transform:scaleX(0)}
.reels{display:flex;gap:16px;margin-top:70px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(18px,4vw,56px) 20px;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{flex:0 0 min(60vw,260px);scroll-snap-align:center;aspect-ratio:9/16;border-radius:26px;overflow:hidden;position:relative;cursor:pointer;border:2px solid var(--ink)}
.reel img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.reel:hover img{transform:scale(1.08)}
.reel .pl{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:2px solid var(--ink)}
.reel .pl .ic{width:22px;height:22px;fill:currentColor;margin-left:3px}
.reelh{margin-top:70px}

<script>
(function(){
  try{history.scrollRestoration='manual'}catch(e){}window.scrollTo(0,0);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,fine=matchMedia('(pointer:fine)').matches;
  var $=function(s,c){return (c||document).querySelector(s)},$$=function(s,c){return [].slice.call((c||document).querySelectorAll(s))};
  var VM=window.VM,D=VM.data;gsap.registerPlugin(ScrollTrigger);
  var CATS=['sound','light','effects'],NAV={sound:'navSound',light:'navLight',effects:'navEffects'},IMG={sound:'about3',light:'layer2',effects:'festival'};
  var lenis=null,openId=null;

  /* ---------- рендер ---------- */
  function renderHero(){
    $('#cbts').innerHTML=CATS.map(function(id,i){var c=VM.cat(id),n=c.groups.reduce(function(a,g){return a+g.items.length},0);
      return '<button class="cbt" data-open="'+id+'"><span class="n">0'+(i+1)+' · '+n+' '+VM.t('items')+'</span><span class="nm">'+VM.t(NAV[id])+VM.icon('arrow')+'</span></button>'}).join('')+
      '<button class="cbt" data-goto="#gallery"><span class="n">04 · '+(D.gallery.photos.length)+'</span><span class="nm">'+VM.t('navGallery')+VM.icon('arrow')+'</span></button>';
    var L=[['navHome','#hero'],['navAbout','#about'],['navSound','sound'],['navLight','light'],['navEffects','effects'],['navGallery','#gallery'],['navContact','#contact']];
    $('#mlinks').innerHTML=L.map(function(l,i){var op=l[1].charAt(0)!=='#';return '<a class="big" href="'+(op?'#catalog':l[1])+'" '+(op?'data-open="'+l[1]+'"':'')+'><span>'+VM.t(l[0])+'</span><small>0'+(i+1)+'</small></a>'}).join('');
    var w=[VM.t('navSound'),VM.t('navLight'),VM.t('navEffects'),'Vinyl M'],h='';for(var k=0;k<3;k++)w.forEach(function(x){h+='<span>'+x+'</span><i>✱</i>'});$('#mq').innerHTML=h;
  }
  function renderRows(){
    $('#rows').innerHTML=CATS.map(function(id,i){var c=VM.cat(id),n=c.groups.reduce(function(a,g){return a+g.items.length},0);
      var grp=c.groups.map(function(g){return '<div class="g"><h4>'+VM.icon(g.icon)+g.name+'<em>'+g.items.length+'</em></h4><ul>'+g.items.map(function(x,k){return '<li'+(g.hot&&g.hot[k]?' class="hot"':'')+'>'+x+'</li>'}).join('')+'</ul></div>'}).join('');
      return '<div class="row'+(openId===id?' on':'')+'" data-row="'+id+'"><button type="button" data-rowbtn="'+id+'"><span class="no">0'+(i+1)+'</span><span class="nm">'+VM.t(NAV[id])+'</span><span class="ct">'+n+' '+VM.t('items')+'</span><span class="ar">'+VM.icon('plus')+'</span></button><div class="bd" style="height:'+(openId===id?'auto':'0')+'"><div class="groups">'+grp+'</div></div></div>'}).join('');
  }
  function renderPortfolio(){
    $('#names').innerHTML=D.artists.map(function(a){return '<span>'+VM.nm(a)+'</span>'}).join('<i>/</i>');
    $('#evs').innerHTML=D.events.map(function(e,i){return '<div class="e"><b>0'+(i+1)+'</b><span>'+VM.nm(e)+'</span></div>'}).join('');
  }
  var gOrder=[1,2,3,13,14,15,16,17,18,19,10,11,12,20,21,22,23,24,4,5,6,7,8,9];
  function renderGallery(){
    var pick=[1,13,2,14,3,15,10,16,4,17,11,18,5,19,12,20];
    $('#gtrack').innerHTML=pick.map(function(n,i){return '<div class="gc" data-p="'+n+'"><span class="no">'+(i<9?'0':'')+(i+1)+'</span><img src="assets/img/g'+n+'.webp" alt="" loading="lazy"></div>'}).join('')+
      '<div class="gc endc"><h3>'+VM.t('allPhotos')+'</h3><button class="btn solid" id="allP" type="button">'+VM.t('viewAllGallery')+'</button></div>';
    $('#reels').innerHTML=D.gallery.videos.map(function(n){return '<div class="reel" data-v="'+n+'"><img src="assets/img/v'+n+'.webp" alt="" loading="lazy"><div class="pl">'+VM.icon('play')+'</div></div>'}).join('');
    var ap=$('#allP');if(ap)ap.onclick=function(){VM.lightbox(gOrder.map(function(x){return 'assets/img/g'+x+'.webp'}),0)};
  }
  function icons(){$('#pArrow').innerHTML=VM.icon('arrow');$('#ic1').innerHTML=VM.icon('pin');$('#ic2').innerHTML=VM.icon('phone');$('#ic3').innerHTML=VM.icon('mail');$('#ic4').innerHTML=VM.icon('insta');$('#ic5').innerHTML=VM.icon('fb')}
  function all(){renderHero();renderRows();renderPortfolio();renderGallery();refreshPin()}
  VM.onLang(function(){all();splitAll()});
  VM.init();icons();all();

  function splitAll(){
    $$('[data-split]').forEach(function(h){
      if(h.dataset.done===VM.lang)return;
      var out='',tmp=document.createElement('div');tmp.innerHTML=h.innerHTML;
      (function walk(n,tag){n.childNodes.forEach(function(c){
        if(c.nodeType===3){c.textContent.split(/([ \t\r\n]+)/).forEach(function(w){if(!w)return;out+=/^[ \t\r\n]+$/.test(w)?' ':(tag?'<span class="text-gold">':'')+'<span class="wd"><span>'+w+'</span></span>'+(tag?'</span>':'')})}
        else if(c.nodeName==='SPAN'||c.nodeName==='EM'){walk(c,'x')}
        else if(c.nodeName==='BR'){out+='<br>'}
      })})(tmp);
      h.innerHTML=out;h.dataset.done=VM.lang;
      gsap.from($$('.wd>span',h),{yPercent:115,rotate:3,duration:1.1,ease:'expo.out',stagger:.05,scrollTrigger:{trigger:h,start:'top 90%',once:true}});
    });
  }
  splitAll();

  /* ---------- скролл ---------- */
  if(window.Lenis&&!reduce){lenis=new Lenis({lerp:.085});VM.lenis=lenis;lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(function(t){lenis.raf(t*1000)});gsap.ticker.lagSmoothing(0)}
  function goto(sel,off){var el=typeof sel==='string'?$(sel):sel;if(!el)return;lenis?lenis.scrollTo(el,{offset:off||0}):el.scrollIntoView({behavior:'smooth'})}
  gsap.to('.progress',{scaleX:1,ease:'none',scrollTrigger:{start:0,end:'max',scrub:.3}});
  ScrollTrigger.create({start:60,onUpdate:function(s){$('#top').classList.toggle('solid',s.scroll()>60)}});

  /* меню */
  var mOpen=false;
  function setMenu(o){mOpen=o;$('#menubtn').classList.toggle('on',o);var m=$('#menu');m.classList.toggle('on',o);lenis&&(o?lenis.stop():lenis.start());
    gsap.to(m,{clipPath:o?'inset(0 0 0% 0)':'inset(0 0 100% 0)',duration:.8,ease:'expo.inOut',onComplete:function(){if(!o)m.style.visibility='hidden';else m.style.visibility='visible'}});
    if(o){m.style.visibility='visible';gsap.fromTo('#menu a.big span',{yPercent:110},{yPercent:0,duration:.8,ease:'expo.out',stagger:.05,delay:.3})}}
  $('#menubtn').onclick=function(){setMenu(!mOpen)};

  /* аккордеон каталога */
  function openRow(id,scroll){
    var rows=$$('.row'),target=null;
    rows.forEach(function(r){var on=r.dataset.row===id,was=r.classList.contains('on'),bd=$('.bd',r);
      if(on&&!was){r.classList.add('on');gsap.to(bd,{height:'auto',duration:.9,ease:'expo.out'});gsap.from($$('.g',r),{y:30,opacity:0,stagger:.07,duration:.8,delay:.15,ease:'power3.out',clearProps:'transform,opacity'});target=r}
      else if(on&&was&&!scroll){r.classList.remove('on');gsap.to(bd,{height:0,duration:.7,ease:'expo.inOut'});id=null}
      else if(!on&&was){r.classList.remove('on');gsap.to(bd,{height:0,duration:.7,ease:'expo.inOut'})}});
    openId=id;setTimeout(function(){ScrollTrigger.refresh()},1000);return target;
  }
  document.addEventListener('click',function(e){
    var o=e.target.closest('[data-open]');
    if(o){e.preventDefault();var wasMenu=mOpen;if(mOpen)setMenu(false);var id=o.dataset.open;
      setTimeout(function(){goto('#catalog',-10);setTimeout(function(){var t=openRow(id,true);},wasMenu?450:350)},wasMenu?500:0);return}
    var rb=e.target.closest('[data-rowbtn]');if(rb){openRow(rb.dataset.rowbtn,false);return}
    var g=e.target.closest('[data-goto]');if(g){goto(g.dataset.goto);return}
    var p=e.target.closest('[data-p]');if(p){VM.lightbox(gOrder.map(function(x){return 'assets/img/g'+x+'.webp'}),Math.max(0,gOrder.indexOf(+p.dataset.p)));return}
    var v=e.target.closest('[data-v]');if(v){VM.video('assets/video/reel'+v.dataset.v+'.mp4','assets/img/v'+v.dataset.v+'.webp');return}
    var a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href').length>1){e.preventDefault();if(mOpen){setMenu(false);setTimeout(function(){goto(a.getAttribute('href'))},500)}else goto(a.getAttribute('href'))}
  });

  /* видео-подложка баннера: играет, пока видна */
  var pv=$('#pvid');if(pv&&!reduce){var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){pv.play().catch(function(){})}else pv.pause()})},{threshold:.1});io.observe(pv)}
  /* hero: пластинка, текст, расширение фото */
  var rotY={v:0};
  gsap.to('#rec',{rotation:360,duration:26,ease:'none',repeat:-1});
  gsap.to('.vrec .disc,.vrec .lab',{scale:1,duration:0}); /* no-op: слои вращаются вместе с #rec */
  gsap.to('#rec',{yPercent:-12,ease:'none',scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}});
  ScrollTrigger.create({trigger:'#hero',start:'top top',end:'bottom top',scrub:true,onUpdate:function(s){gsap.set('#rec',{x:s.progress*80})}});
  gsap.fromTo('#bandFr',{scale:.9,borderRadius:60},{scale:1,borderRadius:36,ease:'none',scrollTrigger:{trigger:'.band',start:'top 95%',end:'top 35%',scrub:true}});
  gsap.fromTo('#bandImg',{yPercent:-7},{yPercent:7,ease:'none',scrollTrigger:{trigger:'.band',start:'top bottom',end:'bottom top',scrub:true}});
  gsap.fromTo('#abImg',{yPercent:-5},{yPercent:5,ease:'none',scrollTrigger:{trigger:'.about .ph',start:'top bottom',end:'bottom top',scrub:true}});

  /* горизонтальная галерея */
  var gmm=gsap.matchMedia(),gst=null;
  function refreshPin(){ScrollTrigger.refresh()}
  gmm.add('(min-width:901px)',function(){
    var track=$('#gtrack'),dist=function(){return Math.max(0,track.scrollWidth-innerWidth)};
    gsap.to(track,{x:function(){return -dist()},ease:'none',scrollTrigger:{trigger:'#pin',start:'top top',end:function(){return '+='+dist()},pin:true,scrub:.8,invalidateOnRefresh:true,anticipatePin:1,onUpdate:function(s){gsap.set('#gb',{scaleX:s.progress})}}});
  });

  /* появление, счётчики, марки */
  ScrollTrigger.batch('.rv',{start:'top 92%',once:true,onEnter:function(els){els.forEach(function(e){e._rd=1});gsap.to(els,{opacity:1,y:0,duration:1,ease:'power3.out',stagger:.1,overwrite:true})}});
  var guard=VM.revealGuard('.rv');ScrollTrigger.create({start:0,end:'max',onUpdate:guard});
  $$('[data-n]').forEach(function(el){var end=+el.dataset.n,o={v:0};ScrollTrigger.create({trigger:el,start:'top 92%',once:true,onEnter:function(){gsap.to(o,{v:end,duration:2,ease:'power2.out',onUpdate:function(){el.textContent=Math.round(o.v)}})}})});
  var mq=gsap.to('#mq',{xPercent:-33.33,ease:'none',duration:28,repeat:-1});
  ScrollTrigger.create({trigger:'.mq',start:'top bottom',end:'bottom top',onUpdate:function(s){mq.timeScale(1+Math.abs(s.getVelocity()/260))}});
  /* форма: отправка в WhatsApp / Viber на номер компании */
  var PHONE='38267439100';
  var formEl=$('#form');
  function compose(){
    var g=function(id){return (document.getElementById(id).value||'').trim()},ev=document.getElementById('b4'),evt=ev.value;
    var L=[VM.t('msgHello'),'',VM.t('formName')+': '+g('b1'),VM.t('formPhone')+': '+g('b2')];
    if(g('b3'))L.push(VM.t('email')+': '+g('b3'));
    if(evt)L.push(VM.t('formEvent')+': '+evt);
    if(g('b5'))L.push(VM.t('formMessage')+': '+g('b5'));
    return L.join('\n');
  }
  function note(t){var n=$('#note');n.style.display='block';n.style.color='var(--red)';n.textContent=t}
  $$('[data-send]').forEach(function(btn){btn.addEventListener('click',function(){
    if(!formEl.reportValidity())return;var text=compose();
    if(btn.dataset.send==='wa'){window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(text),'_blank','noopener')}
    else{try{navigator.clipboard.writeText(text)}catch(e){}note(VM.t('copied'));location.href='viber://chat?number=%2B'+PHONE}
  })});
  formEl.addEventListener('submit',function(e){e.preventDefault();$('[data-send="wa"]').click()});

  /* вступление */
  document.body.classList.add('lock');
  var tl=gsap.timeline({defaults:{ease:'expo.out'},onComplete:function(){document.body.classList.remove('lock');ScrollTrigger.refresh();guard()}});
  tl.to('.loader .rec',{duration:1.3}).to('.loader',{clipPath:'circle(0% at 50% 50%)',duration:1.1,ease:'expo.inOut'}).set('.loader',{display:'none'})
    .from('header.top',{y:-80,opacity:0,duration:1},'-=.5')
    .from('.hero-badge',{y:20,opacity:0,duration:.8},'-=.7')
    .from('.hero h1 .ln>span',{yPercent:115,rotate:2,duration:1.4,stagger:.14},'-=.6')
    .fromTo('.hero-sub,.ctas,.promo,.hint',{y:30,opacity:0},{y:0,opacity:1,stagger:.1,duration:.9,clearProps:'transform,opacity'},'-=1')
    .fromTo('.cbt',{y:60,opacity:0},{y:0,opacity:1,stagger:.08,duration:.9,clearProps:'transform,opacity'},'-=.8')
    .from('#rec',{scale:.7,opacity:0,duration:1.6},'-=1.8');
  if(reduce)tl.progress(1);
  addEventListener('load',function(){ScrollTrigger.refresh()});
})();
</script>
</body>
</html>
